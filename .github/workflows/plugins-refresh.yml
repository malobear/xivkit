# Refreshes the plugin directory every week: re-fetches the plugin lists, rebuilds plugins/,
# and commits the result to main if anything changed. The Pages deploy and IndexNow ping
# then run as usual. Run it by hand from the Actions tab with "Run workflow".

name: Refresh plugin directory

on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plugins-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Fetch and rebuild
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm plugins

      - name: Sanity check
        run: |
          count=$(node -e "console.log(require('./directory/_data/plugins.json').length)")
          echo "plugins: $count"
          if [ "$count" -lt 500 ]; then
            echo "Plugin count looks wrong, not committing."
            exit 1
          fi

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "malobear"
          git config user.email "malobear@users.noreply.github.com"
          git add -A
          git commit -m "Refresh the plugin directory data"
          git push origin HEAD:main
